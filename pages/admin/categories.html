<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kategori - Admin</title>
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png?v=2">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{background:var(--color-bg-alt)}.admin-layout{display:flex;min-height:100vh}.admin-sidebar{width:260px;background:var(--color-card);box-shadow:var(--shadow-md);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:1000}.sidebar-header{padding:var(--spacing-lg);border-bottom:1px solid var(--color-bg-alt)}.sidebar-brand{display:flex;align-items:center;gap:var(--spacing-sm);font-size:var(--font-size-xl);font-weight:700;color:var(--color-primary)}.sidebar-menu{padding:var(--spacing-lg) 0}.menu-item{display:flex;align-items:center;gap:var(--spacing-md);padding:var(--spacing-md) var(--spacing-lg);color:var(--color-text-secondary);font-weight:500;transition:var(--transition-fast);border-left:3px solid transparent}.menu-item:hover{background:var(--color-bg-alt);color:var(--color-primary)}.menu-item.active{background:var(--color-bg-alt);color:var(--color-primary);border-left-color:var(--color-primary)}.menu-item i{width:20px;text-align:center}.sidebar-footer{padding:var(--spacing-lg);border-top:1px solid var(--color-bg-alt)}.admin-main{flex:1;margin-left:260px;padding:var(--spacing-xl);min-width:0;overflow-x:hidden}.admin-header{background:var(--color-card);padding:var(--spacing-lg) var(--spacing-xl);border-radius:var(--border-radius-lg);margin-bottom:var(--spacing-xl);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm)}.page-title{font-size:var(--font-size-2xl);font-weight:700}.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--spacing-lg)}
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; color: var(--color-text-primary); cursor: pointer; padding: 8px; z-index: 100; position: relative; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar-overlay.show { opacity: 1; }
        @media(max-width:768px){.mobile-menu-btn{display:block}.admin-sidebar{transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)}.admin-sidebar.open{transform:translateX(0) !important}.sidebar-overlay.show{display:block;opacity:1}.admin-main{margin-left:0;padding:var(--spacing-md);width:100%;overflow-x:hidden}.admin-header{padding:12px 16px;border-radius:8px;flex-wrap:wrap;gap:12px}.page-title{font-size:18px}.categories-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="brand-logo-container">
                        <img src="../../assets/images/logo-light.png?v=2" alt="Logo" class="brand-logo logo-light">
                        <img src="../../assets/images/logo-dark.png?v=2" alt="Logo" class="brand-logo logo-dark">
                    </div>
                    <span>Reward Point</span>
                </div>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="members.html" class="menu-item"><i class="fas fa-users"></i><span>Kelola Anggota</span></a>
                <a href="rewards.html" class="menu-item"><i class="fas fa-gift"></i><span>Kelola Hadiah</span></a>
                <a href="categories.html" class="menu-item active"><i class="fas fa-tags"></i><span>Kelola Kategori</span></a>
                <a href="products.html" class="menu-item"><i class="fas fa-shopping-bag"></i><span>Kelola Produk</span></a>
                <a href="banners.html" class="menu-item"><i class="fas fa-image"></i><span>Kelola Banner</span></a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width:100%"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Kelola Kategori</h1>
                </div>
                <div style="display:flex;gap:1rem">
                    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                    <button class="btn btn-primary" id="addCategoryBtn"><i class="fas fa-plus"></i> Tambah Kategori</button>
                </div>
            </header>
            <div class="categories-grid" id="categoriesGrid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>
    </div>

    <div class="modal" id="categoryModal">
        <div class="modal-content" style="max-width:500px">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Tambah Kategori</h3>
                <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="categoryId">
                    <div class="form-group">
                        <label class="form-label">Nama Kategori *</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Icon (Font Awesome Class) *</label>
                        <input type="text" class="form-control" id="icon" placeholder="fa-laptop" required>
                        <small style="color:var(--color-text-muted)">Contoh: fa-laptop, fa-tshirt, fa-utensils</small>
                    </div>
                    <div style="margin-top:1rem;padding:1rem;background:var(--color-bg-alt);border-radius:8px;text-align:center">
                        <p style="margin-bottom:0.5rem;font-weight:600">Preview:</p>
                        <i class="fas" id="iconPreview" style="font-size:3rem;color:var(--color-primary)"></i>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancelBtn">Batal</button>
                <button class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Simpan</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import authService from '../../js/services/auth.service.js';
        import categoryService from '../../js/services/category.service.js';
        import{showToast,showConfirm}from'../../js/utils/helpers.js';

        await authService.protectAdminPage();

        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            logoutBtn: document.getElementById('logoutBtn'),
            addCategoryBtn: document.getElementById('addCategoryBtn'),
            categoriesGrid: document.getElementById('categoriesGrid'),
            categoryModal: document.getElementById('categoryModal'),
            modalTitle: document.getElementById('modalTitle'),
            categoryForm: document.getElementById('categoryForm'),
            closeModal: document.getElementById('closeModal'),
            cancelBtn: document.getElementById('cancelBtn'),
            saveBtn: document.getElementById('saveBtn'),
            categoryId: document.getElementById('categoryId'),
            name: document.getElementById('name'),
            icon: document.getElementById('icon'),
            iconPreview: document.getElementById('iconPreview'),
            
            // Mobile Menu
            mobileMenuBtn: document.getElementById('mobileMenuBtn'),
            adminSidebar: document.getElementById('adminSidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay')
        };

        const state = {
            categories: [],
            editingId: null
        };

        // Mobile Menu Toggle
        if (elements.mobileMenuBtn) {
            elements.mobileMenuBtn.addEventListener('click', () => {
                elements.adminSidebar.classList.add('open');
                elements.sidebarOverlay.classList.add('show');
            });
        }

        if (elements.sidebarOverlay) {
            elements.sidebarOverlay.addEventListener('click', () => {
                elements.adminSidebar.classList.remove('open');
                elements.sidebarOverlay.classList.remove('show');
            });
        }

        initTheme();
        loadCategories();

        elements.addCategoryBtn.addEventListener('click',()=>openModal());
        elements.closeModal.addEventListener('click',closeModal);
        elements.cancelBtn.addEventListener('click',closeModal);
        elements.saveBtn.addEventListener('click',saveCategory);
        elements.icon.addEventListener('input',()=>{
            elements.iconPreview.className='fas '+elements.icon.value.trim();
        });
        elements.logoutBtn.addEventListener('click',async()=>{
            if(await showConfirm('Yakin ingin logout?')){
                await authService.logout();
                window.location.href='login.html';
            }
        });

        function initTheme(){
            const theme=localStorage.getItem('theme')||'light';
            document.documentElement.setAttribute('data-theme',theme);
            elements.themeToggle.querySelector('i').className=theme==='light'?'fas fa-moon':'fas fa-sun';
            elements.themeToggle.addEventListener('click',()=>{
                const current=document.documentElement.getAttribute('data-theme');
                const newTheme=current==='light'?'dark':'light';
                document.documentElement.setAttribute('data-theme',newTheme);
                localStorage.setItem('theme',newTheme);
                elements.themeToggle.querySelector('i').className=newTheme==='light'?'fas fa-moon':'fas fa-sun';
            });
        }

        async function loadCategories(){
            const result=await categoryService.getAll();
            if(result.success){
                renderCategories(result.data);
            }else{
                elements.categoriesGrid.innerHTML='<p style="grid-column:1/-1;text-align:center">Gagal memuat data</p>';
            }
        }

        function renderCategories(categories){
            if(!categories||categories.length===0){
                elements.categoriesGrid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-tags"></i><h3>Tidak Ada Kategori</h3><p>Belum ada kategori yang ditambahkan</p></div>`;
                return;
            }

            elements.categoriesGrid.innerHTML=categories.map(c=>`
                <div class="card" style="padding: 1.5rem; text-align: center; border-radius: 12px; transition: transform 0.2s;">
                    <div style="width: 56px; height: 56px; margin: 0 auto 0.75rem; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);">
                        <i class="fas ${c.icon}"></i>
                    </div>
                    <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--color-text-primary);">${c.name}</h3>
                    <div class="card-actions" style="justify-content: center; gap: 8px;">
                        <button class="btn-icon btn-primary" style="width: 32px; height: 32px; font-size: 0.875rem;" onclick="editCategory('${c.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon btn-danger" style="width: 32px; height: 32px; font-size: 0.875rem;" onclick="deleteCategory('${c.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id=null){
            state.editingId=id;
            elements.modalTitle.textContent=id?'Edit Kategori':'Tambah Kategori';
            elements.categoryForm.reset();
            elements.iconPreview.className='fas fa-tag';
            
            if(id){
                categoryService.getById(id).then(result=>{
                    if(result.success){
                        const c=result.data;
                        elements.categoryId.value=c.id;
                        elements.name.value=c.name;
                        elements.icon.value=c.icon;
                        elements.iconPreview.className='fas '+c.icon;
                    }
                });
            }
            
            elements.categoryModal.classList.add('show');
        }

        function closeModal(){elements.categoryModal.classList.remove('show');}

        async function saveCategory(){
            if(!elements.categoryForm.checkValidity()){elements.categoryForm.reportValidity();return;}

            elements.saveBtn.disabled=true;
            elements.saveBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            const categoryData={
                name:elements.name.value.trim(),
                icon:elements.icon.value.trim()
            };

            const result=state.editingId
                ?await categoryService.update(state.editingId,categoryData)
                :await categoryService.create(categoryData);

            if(result.success){
                showToast(state.editingId?'Kategori berhasil diupdate':'Kategori berhasil ditambahkan','success');
                closeModal();
                loadCategories();
            }else{
                showToast(result.error||'Gagal menyimpan','error');
            }

            elements.saveBtn.disabled=false;
            elements.saveBtn.innerHTML='<i class="fas fa-save"></i> Simpan';
        }

        window.editCategory=(id)=>openModal(id);

        window.deleteCategory=async(id)=>{
            if(!await showConfirm('Yakin ingin menghapus kategori ini?'))return;
            
            const result=await categoryService.delete(id);
            if(result.success){
                showToast('Kategori berhasil dihapus','success');
                loadCategories();
            }else{
                showToast(result.error||'Gagal menghapus','error');
            }
        };
    </script>
</body>
</html>
