<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Reward Point</title>
    
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png?v=2">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: var(--color-bg-alt);
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 260px;
            background: var(--color-card);
            box-shadow: var(--shadow-md);
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-bg-alt);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-primary);
        }

        .sidebar-brand i {
            font-size: var(--font-size-2xl);
        }

        .sidebar-menu {
            padding: var(--spacing-lg) 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            color: var(--color-text-secondary);
            font-weight: 500;
            transition: var(--transition-fast);
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: var(--color-bg-alt);
            color: var(--color-primary);
        }

        .menu-item.active {
            background: var(--color-bg-alt);
            color: var(--color-primary);
            border-left-color: var(--color-primary);
        }

        .menu-item i {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--color-bg-alt);
        }

        /* Main Content */
        .admin-main {
            flex: 1;
            margin-left: 260px;
            padding: var(--spacing-xl);
            min-width: 0;
            overflow-x: hidden;
        }

        .admin-header {
            background: var(--color-card);
            padding: var(--spacing-lg) var(--spacing-xl);
            border-radius: var(--border-radius-lg);
            margin-bottom: var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .page-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .admin-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        /* Dashboard Stats */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card-admin {
            background: var(--color-card);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .stat-card-admin:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }

        .stat-card-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-2xl);
            color: white;
        }

        .stat-value {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }

        /* Recent Activity */
        .activity-section {
            background: var(--color-card);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }

        .section-title-admin {
            font-size: var(--font-size-xl);
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .activity-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--color-bg-alt);
            display: flex;
            gap: var(--spacing-md);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-alt);
            color: var(--color-primary);
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .activity-time {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--color-text-primary);
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            position: relative;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.show {
            opacity: 1;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .admin-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .admin-sidebar.open {
                transform: translateX(0) !important;
            }

            .sidebar-overlay.show { display: block; opacity: 1; }

            .admin-main {
                margin-left: 0;
                padding: var(--spacing-md);
                width: 100%;
                overflow-x: hidden;
            }

            .admin-header {
                padding: 12px 16px;
                border-radius: 8px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .dashboard-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="brand-logo-container">
                        <img src="../../assets/images/logo-light.png?v=2" alt="Logo" class="brand-logo logo-light">
                        <img src="../../assets/images/logo-dark.png?v=2" alt="Logo" class="brand-logo logo-dark">
                    </div>
                    <span>Reward Point</span>
                </div>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item active"><i class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="members.html" class="menu-item"><i class="fas fa-users"></i><span>Kelola Anggota</span></a>
                <a href="rewards.html" class="menu-item"><i class="fas fa-gift"></i><span>Kelola Hadiah</span></a>
                <a href="categories.html" class="menu-item"><i class="fas fa-tags"></i><span>Kelola Kategori</span></a>
                <a href="products.html" class="menu-item"><i class="fas fa-shopping-bag"></i><span>Kelola Produk</span></a>
                <a href="banners.html" class="menu-item"><i class="fas fa-image"></i><span>Kelola Banner</span></a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="admin-actions">
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="../../index.html" class="btn btn-outline" target="_blank">
                        <i class="fas fa-external-link-alt"></i> Lihat Website
                    </a>
                </div>
            </header>

            <!-- Stats -->
            <div class="dashboard-stats">
                <div class="stat-card-admin">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalMembers">0</div>
                            <div class="stat-label">Total Anggota</div>
                        </div>
                        <div class="stat-card-icon" style="background: var(--color-primary);">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card-admin">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalRewards">0</div>
                            <div class="stat-label">Total Hadiah</div>
                        </div>
                        <div class="stat-card-icon" style="background: var(--color-secondary);">
                            <i class="fas fa-gift"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card-admin">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalRedeems">0</div>
                            <div class="stat-label">Total Penukaran</div>
                        </div>
                        <div class="stat-card-icon" style="background: var(--color-success);">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card-admin">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalPoints">0</div>
                            <div class="stat-label">Total Bintang</div>
                        </div>
                        <div class="stat-card-icon" style="background: var(--color-warning);">
                            <i class="fas fa-star"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="activity-section">
                <h2 class="section-title-admin">
                    <i class="fas fa-clock"></i>
                    Aktivitas Terkini
                </h2>
                <div id="recentActivity">
                    <p class="text-center" style="padding: 2rem; color: var(--color-text-muted);">
                        <i class="fas fa-spinner fa-spin"></i> Memuat aktivitas...
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Dashboard Script -->
    <script type="module">
        import authService from '../../js/services/auth.service.js';
        import statsService from '../../js/services/stats.service.js';
        import redeemService from '../../js/services/redeem.service.js';
        import { formatNumber, formatRelativeTime, showToast } from '../../js/utils/helpers.js';

        // Protect admin page
        await authService.protectAdminPage();

        // DOM Elements
        const elements = {
            totalMembers: document.getElementById('totalMembers'),
            totalRewards: document.getElementById('totalRewards'),
            totalRedeems: document.getElementById('totalRedeems'),
            totalPoints: document.getElementById('totalPoints'),
            recentActivity: document.getElementById('recentActivity'),
            themeToggle: document.getElementById('themeToggle'),
            logoutBtn: document.getElementById('logoutBtn')
        };
        
        // Mobile Menu Elements
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const adminSidebar = document.getElementById('adminSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // Mobile Menu Toggle
        mobileMenuBtn.addEventListener('click', () => {
            adminSidebar.classList.add('open');
            sidebarOverlay.classList.add('show');
        });

        sidebarOverlay.addEventListener('click', () => {
            adminSidebar.classList.remove('open');
            sidebarOverlay.classList.remove('show');
        });

        // Initialize
        initTheme();
        loadDashboard();

        // Theme
        function initTheme() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon();
            
            elements.themeToggle.addEventListener('click', toggleTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            const icon = elements.themeToggle.querySelector('i');
            icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }

        // Load Dashboard Data
        async function loadDashboard() {
            try {
                // Load stats
                const statsResult = await statsService.getDashboardStats();
                if (statsResult.success) {
                    const { totalMembers, totalRewards, totalRedeems, totalPoints } = statsResult.data;
                    elements.totalMembers.textContent = formatNumber(totalMembers);
                    elements.totalRewards.textContent = formatNumber(totalRewards);
                    elements.totalRedeems.textContent = formatNumber(totalRedeems);
                    elements.totalPoints.textContent = formatNumber(totalPoints);
                }

                // Load recent activity
                await loadRecentActivity();
            } catch (error) {
                console.error('Load dashboard error:', error);
                showToast('Gagal memuat dashboard', 'error');
            }
        }

        // Load Recent Activity
        async function loadRecentActivity() {
            try {
                const result = await redeemService.getRecent(10);
                
                if (result.success && result.data.length > 0) {
                    renderActivity(result.data);
                } else {
                    elements.recentActivity.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>Belum Ada Aktivitas</h3>
                            <p>Aktivitas redeem akan muncul di sini</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Load activity error:', error);
                elements.recentActivity.innerHTML = '<p class="text-center">Gagal memuat aktivitas</p>';
            }
        }

        function renderActivity(activities) {
            elements.recentActivity.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    <div class="activity-content">
                        <div class="activity-title">
                            ${activity.members?.fullname || 'Unknown'} menukar 
                            ${activity.rewards?.title || 'hadiah'}
                        </div>
                        <div class="activity-time">
                            <i class="fas fa-star"></i> ${formatNumber(activity.point_used)} bintang • 
                            ${formatRelativeTime(activity.created_at)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Logout
        elements.logoutBtn.addEventListener('click', async () => {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                const result = await authService.logout();
                if (result.success) {
                    window.location.href = 'login.html';
                } else {
                    showToast('Logout gagal', 'error');
                }
            }
        });
    </script>
</body>
</html>
